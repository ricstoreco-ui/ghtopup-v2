<!DOCTYPE html>
<html lang="id" data-t="chrome">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google-site-verification" content="PvmRk3uueA2Uctk__beNCJwhItlsjmc88hhsbmCuG_A" />
<meta name="google-site-verification" content="s-AzJZ-oDBaNa4rIagbNrwwZIACp-8cTROVYvmSG9B0" />
<meta name="description" content="GH TOP-UP: top up game cepat dan rapi.">
<link rel="canonical" href="https://ghtopup-v2.pages.dev/">
<title>GH TOP-UP</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js"></script>
<style>
:root{--bg:#06070a;--pan:#0f1116;--pan2:#171a23;--line:#262a35;--chr:#dfe4ec;--mut:#8b93a3;--a:#5cf2ff;--a2:#9aa3b2;--ok:#4ade80;--bad:#ff5d6c;--warn:#ffc65c}
[data-t=neon]{--a:#b78bff;--a2:#5cf2ff;--bg:#07060d}
[data-t=cyber]{--a:#ff4d5e;--a2:#ffb3ba;--bg:#0a0607}
[data-t=ocean]{--a:#4da3ff;--a2:#4df0d0;--bg:#050a12}
[data-t=gold]{--a:#f2c14e;--a2:#fff0b8;--bg:#0b0905}
[data-t=event][data-e=ramadan]{--a:#f2c14e;--a2:#3ddc97;--bg:#05120e}
[data-t=event][data-e=natal]{--a:#ff4d5e;--a2:#4ade80;--bg:#0c0709}
[data-t=event][data-e=tahunbaru]{--a:#ffd76a;--a2:#c084fc;--bg:#08060f}
[data-t=event][data-e=musimpanas]{--a:#ffb347;--a2:#38d6ff;--bg:#06101a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--chr);font:14px/1.5 Sora,system-ui,sans-serif;min-height:100vh;padding-bottom:30px;overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Chakra Petch',sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#app,.top{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);z-index:5}
.logo{font-weight:700;font-size:19px;background:linear-gradient(90deg,#fff,var(--a2) 50%,var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.top nav{margin-left:auto;display:flex;gap:14px;color:var(--mut);font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:color-mix(in srgb,var(--pan) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:14px;transition:transform .25s,border-color .25s,box-shadow .25s}
.hv:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 8px 30px -12px var(--a)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:46px!important}}
.btn{background:linear-gradient(180deg,#eef1f6,var(--a2));color:#0a0c10;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s;display:inline-block}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.1)}
.btn.g{background:transparent;color:var(--chr);border:1px solid var(--line)}
.btn.n{background:var(--a)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.in{width:100%;background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 10px}
.in:focus{outline:2px solid var(--a);outline-offset:1px}
.mut{color:var(--mut)}.sm{font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bd{font-size:11px;border-radius:20px;padding:2px 9px;background:var(--pan2);border:1px solid var(--line)}
.hero{padding:34px 18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,var(--pan2),var(--bg));position:relative;overflow:hidden}
.hero h1{font-size:30px;line-height:1.1;max-width:14em}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(var(--a),transparent 65%);opacity:.3;animation:pu 4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.25);opacity:.45}}
.run{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);padding:6px 0;margin:12px 0;color:var(--mut)}
.run span{display:inline-block;padding-left:100%;animation:r 24s linear infinite}
@keyframes r{to{transform:translateX(-100%)}}
.gc{text-align:center;cursor:pointer}
.gc img,.gc i{display:block;width:100%;height:84px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:linear-gradient(135deg,#2a2f3d,#11141b)}
.gc.cl{opacity:.5}
h2{margin:18px 0 10px;font-size:18px}
.rise{animation:ri .5s both}.rise:nth-child(2){animation-delay:.06s}.rise:nth-child(3){animation-delay:.12s}.rise:nth-child(4){animation-delay:.18s}
@keyframes ri{from{opacity:0;transform:translateY(14px)}}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dl{text-decoration:line-through;color:var(--mut)}
.pick{cursor:pointer}.pick.on{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.pop{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;text-align:center;animation:ri .3s}
.pop .card{max-width:380px;width:100%;padding:28px 20px}.pop .e{font-size:54px;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.cd{font:700 30px 'Chakra Petch';color:var(--a);margin:10px 0}
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#intro .logo{font-size:40px;letter-spacing:.08em;animation:sh 2s linear infinite,ri .9s both}
#intro.out{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pan2);border:1px solid var(--a);border-radius:12px;padding:10px 16px;z-index:60;display:none}
.q{position:fixed;right:10px;bottom:10px;z-index:8;font-size:11px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="intro"><span class="logo">GH TOP-UP</span></div>
<div class="top"><a href="#" class="logo">GH TOP-UP</a><nav><a href="#">Beranda</a><a href="#history">Riwayat</a></nav></div>
<div id="app"></div>
<div id="pop"></div><div id="toast"></div>
<select class="q" id="gq" title="Kualitas grafis"><option value="LOW">Grafis LOW</option><option value="MEDIUM">Grafis MEDIUM</option><option value="MAX">Grafis MAX</option></select>
<script>
/* ===== KONFIGURASI: isi dengan data project Supabase BARU kamu (Settings > API) ===== */
const SUPABASE_URL='https://mxhjnpuzxvynspbzrnte.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_remrKzcrTV1huZetLHTR8Q_7tGClOtv';
/* ================================================================================ */
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const fin=p=>Math.max(0,(p.price||0)-(p.discount||0));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
const wa62=n=>String(n||'').replace(/\D/g,'').replace(/^0/,'62');
let S={store_status:'online',theme:'chrome',event_preset:'ramadan',wa_admin:'083848591646',running_text:'Selamat datang di GH TOP-UP',closed_message:'Toko sedang tutup sementara. Silakan kembali lagi nanti.',maintenance_message:'Web lagi proses update skuyy, mohon sabar ya. Ntar beres!',maintenance_ends_at:'',setup_game:'',qris_url:''};
const closedNow=()=>S.store_status==='closed'||S.store_status==='maintenance';

/* ---------- tema, efek, kualitas grafis ---------- */
const EMO={ramadan:['🌙','⭐','🕌'],natal:['❄️','🎄','🎁'],tahunbaru:['🎆','✨','🥂'],musimpanas:['☀️','🌴','🌊']};
function applyTheme(){const h=document.documentElement;h.dataset.t=S.theme||'chrome';h.dataset.e=S.event_preset||'';fxInit()}
let Q=localStorage.getItem('gh_q')||'MEDIUM',P=[],raf;
$('#gq').value=Q;$('#gq').onchange=e=>{Q=e.target.value;localStorage.setItem('gh_q',Q);fxInit()};
function fxInit(){cancelAnimationFrame(raf);const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const n=matchMedia('(prefers-reduced-motion:reduce)').matches?0:{LOW:0,MEDIUM:40,MAX:110}[Q];
 const ev=S.theme==='event'?EMO[S.event_preset]:null;
 P=Array.from({length:n},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,e:ev?ev[Math.floor(Math.random()*ev.length)]:null,s:Math.random()*10+12}));
 const col=getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#5cf2ff';
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;if(p.y>c.height+20){p.y=-20;p.x=Math.random()*c.width}
  if(p.e){x.font=p.s+'px serif';x.globalAlpha=.7;x.fillText(p.e,p.x,p.y)}else{x.globalAlpha=.55;x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}});x.globalAlpha=1;if(n)raf=requestAnimationFrame(f)})()}
addEventListener('resize',fxInit);

/* ---------- pengaturan & status toko ---------- */
async function loadSettings(){if(!sb)return;const {data}=await sb.from('settings').select('key,value');(data||[]).forEach(r=>S[r.key]=r.value);applyTheme();statusPopup()}
let cdT;
function statusPopup(){clearInterval(cdT);const e=$('#pop');if(sessionStorage.getItem('gh_seen_'+S.store_status+S.setup_game))return e.innerHTML='';
 const st=S.store_status;let d=null;
 if(st==='maintenance')d=['🚧','LAGI MAINTENANCE',esc(S.maintenance_message),S.maintenance_ends_at?'<div class="cd" id="cd">--:--:--</div>':''];
 else if(st==='closed')d=['🔒','TOKO SEDANG TUTUP',esc(S.closed_message||'Toko sedang tutup sementara. Silakan kembali lagi nanti.'),''];
 else if(st==='setup'&&S.setup_game)d=['🛠️','LAGI SETUP GAME','Game '+esc(S.setup_game)+' sedang dalam proses setup. Mohon tunggu ya, skuyy!',''];
 if(!d)return e.innerHTML='';
 e.innerHTML=`<div class="pop"><div class="card"><div class="e">${d[0]}</div><h2>${d[1]}</h2><p class="mut">${d[2]}</p>${d[3]}<br><button class="btn" id="ok">Mengerti</button></div></div>`;
 $('#ok').onclick=()=>{sessionStorage.setItem('gh_seen_'+S.store_status+S.setup_game,1);e.innerHTML=''};
 if(d[3]){const t=()=>{const r=Math.max(0,new Date(S.maintenance_ends_at)-Date.now()),z=n=>String(n).padStart(2,'0');const el=$('#cd');if(el)el.textContent=z(Math.floor(r/36e5))+':'+z(Math.floor(r%36e5/6e4))+':'+z(Math.floor(r%6e4/1e3));if(!r&&el)el.textContent='Sebentar lagi selesai...'};t();cdT=setInterval(t,1000)}}
setInterval(loadSettings,30000);

/* ---------- router ---------- */
async function route(){const h=location.hash.slice(1)||'home',[p,a]=h.split('/');scrollTo(0,0);
 if(!sb){app.innerHTML='<div class="wrap"><div class="card"><h2 style="margin-top:0">Konfigurasi belum diisi</h2><p class="mut">Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas script, lalu jalankan SQL part 1 di Supabase.</p></div></div>';return}
 app.innerHTML='<div class="wrap mut">Memuat...</div>';
 try{await({home,game:()=>game(a),history,admin})[p]?.()||home()}catch(e){app.innerHTML='<div class="wrap"><div class="card bad">Terjadi kesalahan: '+esc(e.message)+'</div></div>'}}
addEventListener('hashchange',route);

async function home(){const {data:g}=await sb.from('games').select('*').order('created_at');
 app.innerHTML=`<div class="wrap"><div class="hero rise"><h1>Top up game, rapi dan terpercaya</h1><p class="mut" style="margin:10px 0 16px">Pilih game, bayar via QRIS, admin proses manual.</p><a class="btn" href="#history">Cek pesanan</a></div>
 <div class="run"><span>${esc(S.running_text)}</span></div><h2>Pilih game</h2>
 ${g&&g.length?`<div class="grid">${g.map(x=>{const o=x.status!=='online';return `<div class="card gc hv rise ${o?'cl':''}" onclick="${o?`toast('${x.status==='setup'?'Game ini sedang disetup, coba lagi nanti ya kak.':'Game ini sedang offline.'}')`:`location.hash='#game/${x.id}'`}">${x.logo_url?`<img src="${esc(x.logo_url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<i></i>'}<b>${esc(x.name)}</b><div class="sm mut">${x.status==='setup'?'🛠️ CLOSE - LAGI SETUP':x.status==='offline'?'⛔ Offline':esc(x.category||'Tersedia')}</div></div>`}).join('')}</div>`
 :`<div class="card" style="text-align:center;padding:36px 16px"><h2 style="margin-top:0">Belum ada game</h2><p class="mut">Admin akan segera menambahkan.</p><br><a class="btn n" href="https://wa.me/${wa62(S.wa_admin)}">Hubungi admin via WhatsApp</a></div>`}</div>`}

let sel=null;
async function game(id){const [{data:g},{data:ps}]=await Promise.all([sb.from('games').select('*').eq('id',id).single(),sb.from('products').select('*').eq('game_id',id).order('price')]);
 sel=null;const lock=closedNow();
 app.innerHTML=`<div class="wrap"><h2 style="margin-top:0">${esc(g.name)}</h2>
 ${lock?`<div class="card warn" style="margin-bottom:12px">${S.store_status==='closed'?'Toko sedang tutup, kamu hanya bisa melihat produk.':'Sedang maintenance, checkout dimatikan sementara.'}</div>`:''}
 <div class="grid">${(ps||[]).map(p=>`<div class="card pick hv rise" data-id="${p.id}"><b>${esc(p.name)}</b> ${p.label&&p.label!=='none'?`<span class="bd warn">${esc(p.label)}</span>`:''}<div>${p.discount?`<span class="dl sm">${rp(p.price)}</span> `:''}${rp(fin(p))}</div><div class="sm ok">Selalu tersedia</div></div>`).join('')||'<p class="mut">Belum ada produk.</p>'}</div>
 <h2>Data pesanan</h2><div class="card"><label>User ID</label><input class="in" id="uid" inputmode="numeric"><label>Server ID (jika ada)</label><input class="in" id="sid"><label>Nomor WhatsApp</label><input class="in" id="wa" inputmode="tel" placeholder="08xxxxxxxxxx"><label><input type="checkbox" id="tos"> Saya setuju syarat dan ketentuan</label><br><br>
 <button class="btn" id="buy" ${lock?'disabled title="Toko sedang tutup, coba lagi nanti"':''}>${lock?'Checkout dimatikan':'Buat pesanan'}</button></div></div>`;
 document.querySelectorAll('.pick').forEach(el=>el.onclick=()=>{document.querySelectorAll('.pick').forEach(e=>e.classList.remove('on'));el.classList.add('on');sel=el.dataset.id});
 $('#buy').onclick=async()=>{if(closedNow())return toast('Toko sedang tutup, coba lagi nanti');
  const uid=$('#uid').value.trim(),wa=$('#wa').value.trim();
  if(!sel)return toast('Pilih produk dulu');if(!/^\d{4,20}$/.test(uid))return toast('User ID tidak valid');if(!/^08\d{8,12}$/.test(wa))return toast('Nomor WA tidak valid');if(!$('#tos').checked)return toast('Setujui syarat dan ketentuan');
  $('#buy').disabled=true;const {data,error}=await sb.rpc('create_order',{p_product:sel,p_user_id:uid,p_server_id:$('#sid').value.trim(),p_wa:wa});
  if(error){$('#buy').disabled=false;return toast(error.message)}pay(data)}}

function pay(o){app.innerHTML=`<div class="wrap"><h2 style="margin-top:0">Pembayaran QRIS</h2><div class="card" style="text-align:center">
 ${S.qris_url?`<img src="${esc(S.qris_url)}" alt="QRIS" style="max-width:220px;width:100%;border-radius:10px;background:#fff">`:'<p class="mut">QRIS belum diatur admin.</p>'}
 <p>Invoice <b>${esc(o.invoice)}</b></p><p>Total <b>${rp(o.total)}</b></p>
 <a class="btn n" href="https://wa.me/${wa62(S.wa_admin)}?text=${encodeURIComponent('Halo admin, saya sudah bayar invoice '+o.invoice)}">Konfirmasi ke admin via WhatsApp</a>
 <p class="sm mut" style="margin-top:10px">Pembayaran diverifikasi manual oleh admin. Simpan nomor invoice untuk cek status.</p></div></div>`}

async function history(){app.innerHTML=`<div class="wrap"><h2 style="margin-top:0">Cek pesanan</h2><div class="card"><input class="in" id="iv" placeholder="Nomor invoice, mis. GH-ABC123"><button class="btn" id="go">Cari</button><div id="res" style="margin-top:12px"></div></div></div>`;
 $('#go').onclick=async()=>{const {data,error}=await sb.rpc('track_order',{p_invoice:$('#iv').value.trim().toUpperCase()});const r=Array.isArray(data)?data[0]:data;
  $('#res').innerHTML=error||!r?'<p class="bad">Invoice tidak ditemukan.</p>':`<p><b>${esc(r.invoice)}</b> - ${esc(r.game_name)} - ${esc(r.product_name)}</p><p>${rp(r.total)} <span class="bd ${r.status==='success'?'ok':r.status==='failed'?'bad':'warn'}">${esc(r.status)}</span></p>`}}

/* ---------- ADMIN (#admin) ---------- */
async function admin(){const {data:{session}}=await sb.auth.getSession();
 if(!session)return app.innerHTML=`<div class="wrap" style="max-width:380px;padding-top:10vh"><div class="card"><h2 style="margin-top:0">Login admin</h2><input class="in" id="em" type="email" placeholder="Email" autocomplete="username"><input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="li">Masuk</button></div></div>`,
  $('#li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('Login gagal: '+error.message);route()};
 const {data:ok}=await sb.rpc('is_admin');
 if(!ok){await sb.auth.signOut();return app.innerHTML='<div class="wrap"><div class="card bad">Akun ini bukan admin.</div></div>'}
 admTab('orders')}
let GL=[];
async function admTab(t){const nav=`<div class="wrap"><div class="tabs">${[['orders','Pesanan'],['games','Game'],['products','Produk'],['store','Toko & Tema']].map(x=>`<button class="btn ${x[0]===t?'':'g'}" onclick="admTab('${x[0]}')">${x[1]}</button>`).join('')}<button class="btn g" onclick="sb.auth.signOut().then(()=>route())">Keluar</button></div><div id="ab"></div></div>`;
 app.innerHTML=nav;const b=$('#ab');const {data:g}=await sb.from('games').select('*').order('created_at');GL=g||[];
 if(t==='orders'){const {data:o}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(50);
  b.innerHTML=`<div class="card ov"><table><tr><th>Invoice</th><th>Game</th><th>Total</th><th>Status</th><th>Aksi</th></tr>${(o||[]).map(r=>`<tr><td>${esc(r.invoice)}</td><td>${esc(r.game_name)}</td><td>${rp(r.total)}</td><td>${esc(r.status)}</td><td><button class="btn g" onclick="setSt('${r.id}','success')">Sukses</button> <button class="btn g" onclick="setSt('${r.id}','failed')">Gagal</button></td></tr>`).join('')||'<tr><td>Belum ada pesanan</td></tr>'}</table></div>`}
 if(t==='games')b.innerHTML=`<div class="card"><h3>Tambah game</h3><input class="in" id="gn" placeholder="Nama game lengkap"><input class="in" id="gs" placeholder="Singkatan"><select class="in" id="gc"><option>MOBA</option><option>Battle Royale</option><option>RPG</option><option>FPS</option><option>Lainnya</option></select><input class="in" id="gl" placeholder="Link logo (https://...)"><select class="in" id="gt"><option value="setup">Setup</option><option value="offline">Offline</option><option value="online">Online</option></select><button class="btn" onclick="addGame()">Simpan dan lanjut isi produk</button></div><br><div class="card ov"><table><tr><th>Game</th><th>Status</th><th>Aksi</th></tr>${GL.map(x=>`<tr><td>${esc(x.name)}</td><td><select class="in" style="margin:0" onchange="gSt('${x.id}',this.value)">${['online','setup','offline'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn g" onclick="delRow('games','${x.id}')">Hapus</button></td></tr>`).join('')}</table></div>`;
 if(t==='products'){const gid=window.admGame||GL[0]?.id;window.admGame=gid;const {data:p}=await sb.from('products').select('*').eq('game_id',gid||'').order('price');
  b.innerHTML=`<select class="in" onchange="admGame=this.value;admTab('products')">${GL.map(x=>`<option value="${x.id}" ${x.id===gid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <div class="card"><h3 id="pt">Tambah produk</h3><input type="hidden" id="pi"><input class="in" id="pn" placeholder="Nama produk, mis. 10 DM"><div class="row"><input class="in" id="pp" inputmode="numeric" placeholder="Harga asli"><input class="in" id="pd" inputmode="numeric" placeholder="Diskon (potongan Rp)"></div><p>Harga akhir: <b id="pf" class="ok">Rp 0</b></p><select class="in" id="pl"><option value="none">Tidak ada label</option><option>Flash Sale</option><option>Diskon</option><option>New</option></select><button class="btn" onclick="saveProd()">Simpan produk</button> <button class="btn g bad" onclick="delProd()">Hapus produk</button></div><br>
  <div class="card ov"><table><tr><th>Produk</th><th>Harga</th><th>Diskon</th><th>Akhir</th><th></th></tr>${(p||[]).map(r=>`<tr><td>${esc(r.name)}</td><td>${rp(r.price)}</td><td>${rp(r.discount)}</td><td>${rp(fin(r))}</td><td><button class="btn g" onclick='editProd(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button></td></tr>`).join('')}</table></div>`;
  const c=()=>$('#pf').textContent=rp(Math.max(0,(+$('#pp').value||0)-(+$('#pd').value||0)));$('#pp').oninput=c;$('#pd').oninput=c}
 if(t==='store'){const F=(k,l,h)=>`<label>${l}</label>${h||`<input class="in" data-k="${k}" value="${esc(S[k])}">`}`,O=(k,a)=>`<select class="in" data-k="${k}">${a.map(v=>`<option ${v===S[k]?'selected':''}>${v}</option>`).join('')}</select>`;
  b.innerHTML=`<div class="card">${F('store_status','Status toko',O('store_status',['online','maintenance','closed','setup']))}${F('closed_message','Pesan saat tutup')}${F('maintenance_message','Pesan maintenance')}${F('maintenance_ends_at','Maintenance selesai (format 2026-11-02T18:00:00+07:00)')}${F('setup_game','Game yang disetup (nama)',`<select class="in" data-k="setup_game"><option value="">-</option>${GL.map(x=>`<option ${x.name===S.setup_game?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}${F('theme','Tema',O('theme',['chrome','neon','cyber','ocean','gold','event']))}${F('event_preset','Varian tema event',O('event_preset',['ramadan','natal','tahunbaru','musimpanas']))}${F('running_text','Running text')}${F('wa_admin','WhatsApp admin')}${F('qris_url','Link gambar QRIS')}<button class="btn" onclick="saveStore()">Simpan pengaturan</button></div>`}}
const setSt=async(id,s)=>{const {error}=await sb.from('orders').update({status:s}).eq('id',id);toast(error?error.message:'Status diubah');admTab('orders')};
async function addGame(){const n=$('#gn').value.trim();if(!n)return toast('Isi nama game');const {data,error}=await sb.from('games').insert({name:n,short_name:$('#gs').value.trim(),category:$('#gc').value,logo_url:$('#gl').value.trim(),status:$('#gt').value}).select().single();if(error)return toast(error.message);window.admGame=data.id;toast('Game disimpan, lanjut isi produk');admTab('products')}
const gSt=async(id,s)=>{const {error}=await sb.from('games').update({status:s}).eq('id',id);toast(error?error.message:'Status game diubah')};
const delRow=async(t,id)=>{if(!confirm('Hapus data ini?'))return;const {error}=await sb.from(t).delete().eq('id',id);toast(error?error.message:'Dihapus');admTab(t)};
function editProd(r){$('#pt').textContent='Edit produk';$('#pi').value=r.id;$('#pn').value=r.name;$('#pp').value=r.price;$('#pd').value=r.discount;$('#pl').value=r.label||'none';$('#pp').oninput();scrollTo(0,0)}
async function saveProd(){const row={game_id:window.admGame,name:$('#pn').value.trim(),price:+$('#pp').value||0,discount:+$('#pd').value||0,label:$('#pl').value};if(!row.name||row.price<=0)return toast('Isi nama dan harga');if(row.discount>=row.price)return toast('Diskon harus lebih kecil dari harga');
 const id=$('#pi').value,q=id?sb.from('products').update(row).eq('id',id):sb.from('products').insert(row);const {error}=await q;toast(error?error.message:'Produk disimpan');admTab('products')}
function delProd(){const id=$('#pi').value;if(!id)return toast('Pilih produk lewat tombol Edit dulu');delRow('products',id)}
async function saveStore(){const rows=[...document.querySelectorAll('[data-k]')].map(e=>({key:e.dataset.k,value:e.value}));const {error}=await sb.from('settings').upsert(rows);toast(error?error.message:'Pengaturan disimpan');if(!error){await loadSettings()}}

/* ---------- mulai ---------- */
(async()=>{applyTheme();setTimeout(()=>{$('#intro').classList.add('out')},sessionStorage.getItem('gh_i')?100:1500);sessionStorage.setItem('gh_i',1);await loadSettings();route()})();
if('serviceWorker'in navigator&&0)navigator.serviceWorker.register('/sw.js');
</script>
